[package]
name = "jarvis-daemon"
version = "0.1.0"
edition = "2021"
description = "Jarvis OS — Windows Activity Daemon (Phase 2)"

[[bin]]
name = "jarvis-daemon"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for backend pushes + ntfy.sh
reqwest = { version = "0.12", features = ["json"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time & dates
chrono = "0.4"

# Windows API for window tracking (only compiled on Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "UI_Notifications",
    "Data_Xml_Dom",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
