<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jarvis OS Autofill</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .container { display: flex; flex-direction: column; gap: 12px; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .logo-container { display: flex; align-items: center; gap: 8px; }

    .logo-icon {
      font-size: 18px;
      animation: pulse 2s infinite ease-in-out;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 9px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-top: -2px;
      -webkit-text-fill-color: var(--text-secondary);
    }

    /* ── STATUS BADGE ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-badge::before {
      content: "●";
      font-size: 8px;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    /* ── CARD ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 12px;
      transition: border-color 0.3s;
    }

    .card:hover { border-color: rgba(99, 102, 241, 0.25); }

    /* ── COMPLETENESS BAR ── */
    .completeness-section { display: flex; flex-direction: column; gap: 6px; }

    .completeness-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .completeness-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); }

    .completeness-pct {
      font-size: 13px;
      font-weight: 700;
      transition: color 0.3s;
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── MISSING FIELDS CHIP ROW ── */
    .missing-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .chip {
      font-size: 9px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
      cursor: default;
    }

    .chip-more {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-secondary);
      border-color: var(--card-border);
    }

    /* ── PROFILE ROWS ── */
    .profile-info { display: flex; flex-direction: column; gap: 6px; }

    .profile-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      align-items: center;
    }

    .label { color: var(--text-secondary); font-size: 11px; }

    .value {
      font-weight: 500;
      max-width: 175px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .value.missing {
      color: rgba(239, 68, 68, 0.7);
      font-style: italic;
      font-size: 11px;
    }

    /* ── ATS DETECTOR ── */
    .ats-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }

    .ats-icon { font-size: 14px; }
    .ats-label { flex: 1; }
    .ats-coverage {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ── BUTTONS ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn:hover {
      background: #4f46e5;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn:active { transform: translateY(1px); }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      box-shadow: none;
      font-size: 11px;
      padding: 7px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      box-shadow: none;
    }

    /* ── MANUAL TOKEN BOX ── */
    .token-box {
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .token-label { font-size: 10px; font-weight: 500; color: var(--text-secondary); }

    .token-row { display: flex; gap: 6px; }

    .token-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: 'Outfit', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .token-input:focus { border-color: var(--accent); }

    /* ── ERROR ── */
    .error-msg {
      font-size: 11px;
      color: #f87171;
      text-align: center;
      display: none;
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: 8px;
      padding: 6px 10px;
    }

    /* ── FOOTER ── */
    .footer {
      font-size: 10px;
      text-align: center;
      color: var(--text-secondary);
    }

    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--card-border);
      margin: 2px 0;
    }

    /* ── TAILOR BUTTON (amber/gold gradient) ── */
    .btn-tailor {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-tailor:hover {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
    }

    /* ── TAILOR LOADING STATE ── */
    .tailor-status {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 10px;
      font-size: 11px;
      color: #fbbf24;
      font-weight: 500;
    }

    .tailor-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(245,158,11,0.3);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .loading-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="logo-container">
        <span class="logo-icon">⚡</span>
        <div>
          <span class="title">Jarvis OS</span>
          <span class="subtitle">Job Autofiller</span>
        </div>
      </div>
      <div id="status-badge" class="status-badge">Disconnected</div>
    </div>

    <!-- ATS DETECTOR -->
    <div id="ats-badge" class="ats-badge" style="display:none;">
      <span class="ats-icon" id="ats-icon">🌐</span>
      <span class="ats-label" id="ats-label">Detecting ATS...</span>
      <span class="ats-coverage" id="ats-coverage"></span>
    </div>

    <!-- PROFILE CARD -->
    <div class="card" id="profile-card">
      <div id="profile-details">
        <div style="text-align:center; color:var(--text-secondary); padding: 12px 0; font-size:12px;" class="loading-shimmer">
          Checking connection...
        </div>
      </div>
    </div>

    <!-- MANUAL TOKEN -->
    <div id="manual-login-box" class="card token-box">
      <div class="token-label">Or paste your session token manually:</div>
      <div class="token-row">
        <input type="password" id="manual-token-input" class="token-input" placeholder="Paste token here...">
        <button id="save-manual-token-btn" class="btn" style="width:auto; padding:6px 12px; font-size:11px; border-radius:6px;">Save</button>
      </div>
    </div>

    <!-- ERROR -->
    <div id="error-box" class="error-msg"></div>

    <!-- AUTOFILL BUTTON -->
    <button id="autofill-btn" class="btn" disabled>
      ⚡ Autofill Application
    </button>

    <!-- TAILOR BUTTON -->
    <button id="tailor-btn" class="btn btn-tailor" disabled>
      🪄 Tailor for this Job
    </button>

    <!-- TAILOR STATUS (loading) -->
    <div class="tailor-status" id="tailor-status">
      <div class="tailor-spinner"></div>
      <span id="tailor-status-text">Analyzing job description...</span>
    </div>

    <!-- COMPLETE PROFILE BUTTON -->
    <a id="complete-profile-link" href="http://localhost:3000/profile" target="_blank" style="display:none;">
      <button class="btn btn-secondary" style="width:100%;">
        📝 Complete Profile (opens app)
      </button>
    </a>

    <!-- FOOTER -->
    <div class="footer">
      Connected to <a href="http://localhost:3000" target="_blank">Study Tracker</a>
      &nbsp;·&nbsp; v3.0.0
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
