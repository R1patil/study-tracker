<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Antigravity Autofill</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-success: #10b981;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      font-size: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .label {
      color: var(--text-secondary);
    }

    .value {
      font-weight: 500;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn:hover {
      background: #4f46e5;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .footer {
      font-size: 11px;
      text-align: center;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .error-msg {
      font-size: 12px;
      color: #f87171;
      text-align: center;
      display: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <span class="logo-icon">⚡</span>
        <span class="title">Antigravity Autofill</span>
      </div>
      <div id="status-badge" class="status-badge">Disconnected</div>
    </div>

    <div class="card" id="profile-card">
      <div class="profile-info" id="profile-details">
        <div style="text-align: center; color: var(--text-secondary); padding: 12px 0;">
          Checking connection status...
        </div>
      </div>
    </div>

    <div id="manual-login-box" style="display: none; flex-direction: column; gap: 8px;" class="card">
      <div style="font-size: 11px; font-weight: 500; color: var(--text-secondary);">Or paste token manually:</div>
      <div style="display: flex; gap: 6px;">
        <input type="password" id="manual-token-input" style="flex: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--card-border); color: white; padding: 6px 10px; border-radius: 6px; font-size: 12px; outline: none;" placeholder="Autofill token...">
        <button id="save-manual-token-btn" class="btn" style="width: auto; padding: 6px 12px; font-size: 12px; border-radius: 6px;">Save</button>
      </div>
    </div>

    <div id="error-box" class="error-msg"></div>

    <button id="autofill-btn" class="btn" disabled>
      ⚡ Autofill Application
    </button>

    <div class="footer">
      Connected to <a href="http://localhost:3000" target="_blank">Study Tracker</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
